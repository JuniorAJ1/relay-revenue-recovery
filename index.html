<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark" aria-hidden="true">↗</span><div>relay<small>REVENUE RECOVERY</small></div></div><div class="workspace"><strong>Sales team workspace</strong>Concept edition · October 2026</div><nav class="nav" aria-label="Main navigation"><button data-route="overview" class="active"><span class="navicon" aria-hidden="true">▦</span>Overview</button><button data-route="queue"><span class="navicon" aria-hidden="true">↗</span>Recovery queue</button><button data-route="outcomes"><span class="navicon" aria-hidden="true">◷</span>Cash ledger</button><button data-route="playbook"><span class="navicon" aria-hidden="true">≡</span>Playbook</button><button data-route="connections"><span class="navicon" aria-hidden="true">⌘</span>Connections</button></nav><div class="sidebottom"><strong>A second chance for every lead.</strong>Built for teams that measure what actually gets collected.<br><br><button class="reset" data-action="reset">Reset sample workspace</button></div></aside><div class="main"><header class="topbar"><div class="crumb">Workspace <span aria-hidden="true"> / </span> <strong id="breadcrumb">Overview</strong></div><div class="topright"><span class="pill"><span class="dot"></span>Sample data · offline demo</span><button class="button secondary" id="present" aria-pressed="false">Present</button><div class="avatar" aria-label="Sample workspace">ST</div></div></header><main class="content" id="view"></main></div></div>
<dialog class="dialog" id="lead-dialog" aria-labelledby="lead-title"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>const RelayModel = (() => {
  const names = ['Priya Shah','Marcus Reed','Elena Torres','James Walker','Aisha Bennett','Oliver Grant','Nora Evans','Daniel Kim','Sofia Martin','Theo Brooks','Amelia Clark','Leo Patel','Isabel Chen','Ethan Hughes','Maya Foster','Lucas Hayes','Zara Wilson','Noah Carter','Chloe Lewis','Adam Scott','Freya Moore','Ben Collins','Lily Parker','Owen Adams','Grace Wright'];
  const sources = ['VSL opt-in','Webinar','VSL opt-in','Demo no-show'];
  const contexts = ['Asked about the onboarding process. No follow-up after the first conversation.','Watched the presentation and requested a call. Last message went unanswered.','Interested in the offer but asked to revisit after a busy month.','Missed the demo. No reschedule attempt is recorded.'];
  function seed() {
    return names.map((name,i) => {
      const status = i < 10 ? 'ready' : i < 13 ? 'waiting' : i < 16 ? 'booked' : i < 18 ? 'attended' : i < 21 ? 'collected' : 'excluded';
      const reasons = ['Opted out of outreach','Already an active customer','Active conversation with another rep','Contact permission not verified'];
      const lead = {id:'L'+String(i+1).padStart(3,'0'),name,source:sources[i%4],idle:[18,12,24,7,31,9,16,22,11,28][i%10],owner:['Alex','Jordan','Taylor'][i%3],context:contexts[i%4],status,reason:i>=21?reasons[i-21]:'',consent:![21,24].includes(i),booked:['booked','attended','collected'].includes(status),attended:['attended','collected'].includes(status),payments:[],refunds:[],draft:'',events:[{label:'Lead entered the sample pipeline',detail:sources[i%4],at:'Sample history'}]};
      if(i>=10 && i<=20) lead.events.push({label:'Recovery follow-up approved',detail:'Sample outreach event',at:'Sample history'});
      if(lead.booked)lead.events.push({label:'Demo booked',detail:'Assigned to '+lead.owner,at:'Sample history'});
      if(lead.attended)lead.events.push({label:'Demo attended',detail:'Attendance recorded',at:'Sample history'});
      if(status==='collected') {lead.payments=[{id:'P'+i,amount:[12000,15000,10000][i-18],date:['2026-09-29','2026-09-30','2026-10-01'][i-18]}];lead.events.push({label:'Sample payment settled',detail:'Payment matched to the lead',at:'Sample history'});}
      if(i===19) {lead.refunds=[{amount:2000,date:'2026-10-02'}];lead.events.push({label:'Partial sample refund',detail:'$2,000 deducted from collections',at:'Sample history'});}
      return lead;
    });
  }
  const gross = l => l.payments.reduce((s,p)=>s+p.amount,0);
  const refunds = l => l.refunds.reduce((s,p)=>s+p.amount,0);
  const net = l => gross(l)-refunds(l);
  const eligible = l => l.consent && !l.reason && l.status==='ready';
  function stats(leads) {return {ready:leads.filter(eligible).length,waiting:leads.filter(l=>l.status==='waiting').length,booked:leads.filter(l=>l.booked).length,attended:leads.filter(l=>l.attended).length,gross:leads.reduce((s,l)=>s+gross(l),0),refunds:leads.reduce((s,l)=>s+refunds(l),0),net:leads.reduce((s,l)=>s+net(l),0),excluded:leads.filter(l=>l.reason).length};}
  function draft(l,channel) {
    const first=l.name.split(' ')[0];
    const text=l.source==='Demo no-show' ? `Hi ${first}, we missed you on the last call. Would you like to find another time? Happy to help, or let me know if it is no longer relevant.` : l.source==='Webinar' ? `Hi ${first}, following up on the session you joined. Is there anything you would like us to clarify? If it would help, we can arrange a short call with the team.` : `Hi ${first}, you previously asked about getting started. Is that still something you are considering? Happy to answer your questions or help you book a short call.`;
    return channel==='Email' ? `Subject: A quick follow-up\n\n${text}\n\n${l.owner}\n\nReply unsubscribe if you would prefer no further messages.` : `${text} Reply STOP to opt out.`;
  }
  function transition(l,action,payload={}) {
    let label,detail;
    if(action==='queue') {if(!eligible(l))throw Error('This lead is not eligible for outreach.'); if(!payload.message?.trim())throw Error('Write a message before approving it.');l.draft=payload.message;l.status='waiting';label='Demo follow-up approved';detail='Local simulation only. Nothing was sent.';}
    else if(action==='book') {if(l.status!=='waiting')throw Error('A booked reply requires a waiting lead.');l.status='booked';l.booked=true;label='Interested reply → demo booked';detail='Simulated reply. Demo assigned to '+l.owner+'.';}
    else if(action==='attend') {if(l.status!=='booked')throw Error('Only a booked demo can be marked attended.');l.status='attended';l.attended=true;label='Demo attended';detail='Simulated attendance recorded.';}
    else if(action==='collect') {if(l.status!=='attended')throw Error('Only an attended demo can receive a sample collection.');const amount=Number(payload.amount);if(!Number.isFinite(amount)||amount<0.01||amount>1000000)throw Error('Enter an amount between $0.01 and $1,000,000.');l.payments.push({id:'SIM-'+l.id,amount:Math.round(amount*100)/100,date:'2026-10-02'});l.status='collected';label='Sample payment settled';detail='Simulated collection matched to '+l.id+'.';}
    else if(action==='refund') {const amount=Number(payload.amount);if(l.status!=='collected'||!Number.isFinite(amount)||amount<0.01||amount>net(l))throw Error('Refund must be positive and cannot exceed remaining collections.');l.refunds.push({amount:Math.round(amount*100)/100,date:'2026-10-02'});label='Sample refund recorded';detail='Net collections updated.';}
    else throw Error('Unknown action.');
    l.events.push({label,detail,at:'This demo session'});return l;
  }
  function forecast(leads,booking,show,close,cash) {return leads*booking/100*show/100*close/100*cash;}
  return {seed,stats,gross,refunds,net,eligible,draft,transition,forecast};
})();

(() => {
  'use strict';
  const M=RelayModel, key='relay-demo-v1', view=document.getElementById('view'), dialog=document.getElementById('lead-dialog');
  let leads=M.seed(),route='overview',selected=null,channel='SMS',search='',filter='ready',toastTimer;
  try {const stored=JSON.parse(localStorage.getItem(key));if(Array.isArray(stored)&&stored.length===25&&stored.every(l=>l.id&&Array.isArray(l.events)&&Array.isArray(l.payments)&&Array.isArray(l.refunds)))leads=stored;}catch{}
  const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2,minimumFractionDigits:0}).format(n);
  const labels={ready:'Ready to recover',waiting:'Awaiting reply',booked:'Demo booked',attended:'Demo attended',collected:'Collected',excluded:'Excluded'};
  const names={overview:'Overview',queue:'Recovery queue',outcomes:'Cash ledger',playbook:'Playbook',connections:'Connections'};
  const initials=n=>n.split(' ').map(x=>x[0]).join('');
  function save(){try{localStorage.setItem(key,JSON.stringify(leads));}catch{notify('Session saved in memory. Browser storage is unavailable.');}}
  function notify(text){document.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4000);}
  const badge=l=>`<span class="badge ${l.status}">${labels[l.status]}</span>`;
  const heading=(eyebrow,title,sub,action='')=>`<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;
  const stat=(label,value,caption)=>`<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="caption">${caption}</div></div>`;
  const person=l=>`<div class="person"><div class="initials" aria-hidden="true">${initials(l.name)}</div><div><button data-lead="${l.id}" aria-label="Open ${l.name}">${l.name}</button><small>${l.source}</small></div></div>`;
  function table(rows,short=false){return `<div class="tablewrap"><table><thead><tr><th>Lead</th><th>${short?'Last touch':'Status'}</th><th>${short?'Next action':'Owner'}</th><th><span class="sr">Review</span></th></tr></thead><tbody>${rows.map(l=>`<tr><td>${person(l)}</td><td>${short?`<span>${l.idle} days ago</span>`:badge(l)}</td><td>${short?(l.source==='Demo no-show'?'Offer a reschedule':'Review follow-up'):l.owner}</td><td><button class="rowaction" data-lead="${l.id}" aria-label="Review ${l.name}">Review ↗</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No leads match this view.</td></tr>'}</tbody></table></div>`;}
  function overview(){const s=M.stats(leads),ready=leads.filter(M.eligible),progressed=Math.max(1,leads.filter(l=>['waiting','booked','attended','collected'].includes(l.status)).length);return heading('THE RECOVERY DESK','The money is in the follow-up.','Turn overlooked conversations into measurable outcomes.',`<button class="button" data-action="demo">Walk through a recovery <span aria-hidden="true">↗</span></button>`)+`<section class="hero"><div><div class="eyebrow">ALREADY IN YOUR PIPELINE</div><h2>You paid for the lead.<br><em>Make the next conversation count.</em></h2><p>${s.ready} sample leads are ready for a thoughtful follow-up. Find the context, review the message, and measure what happens next.</p><button class="button lime" data-route="queue">Explore recovery queue <span aria-hidden="true">→</span></button></div><div class="flowvisual" aria-label="Recovery workflow"><div class="flowline"><span class="num">01</span><div><strong>Find the missed opportunity</strong><small>Permission checked · ownership respected</small></div><span class="right">↗</span></div><div class="flowline"><span class="num">02</span><div><strong>Review the right follow-up</strong><small>Context first · human approval</small></div><span class="right">↗</span></div><div class="flowline"><span class="num">03</span><div><strong>Follow it through to cash</strong><small>Booking → attendance → settlement</small></div><span class="right">$</span></div></div></section><section class="stats" aria-label="Sample workspace metrics">${stat('Ready to recover',s.ready,'Eligible sample leads')}${stat('Recovery demos booked',s.booked,'Includes attended and collected')}${stat('Sample net collections',money(s.net),'Settled payments less refunds')}${stat('Protected from outreach',s.excluded,'Opt-outs, customers & active leads')}</section><div class="split"><section class="panel"><div class="panelheader"><div><h2>Conversations worth reopening</h2><small>Review the context before the next touch.</small></div><button class="button text" data-route="queue">View all →</button></div>${table(ready.slice(0,5),true)}</section><aside class="panel asidepanel"><h2>Follow-through, not vanity.</h2><p class="kicker">Sample recovery journey</p>${[['Follow-up approved',leads.filter(l=>['waiting','booked','attended','collected'].includes(l.status)).length],['Demo booked',s.booked],['Demo attended',s.attended],['Collected',leads.filter(l=>M.net(l)>0).length]].map(([label,count],i)=>`<div class="funnelrow"><div class="funnellabel"><span>${label}</span><strong>${count}</strong></div><div class="track"><div class="fill" style="width:${count/progressed*100}%;opacity:${1-i*.16}"></div></div></div>`).join('')}<div class="asidefoot"><strong>${money(s.refunds)}</strong>Sample refunds already deducted.<br>Collections are attributed, not proven incremental lift.</div></aside></div><footer class="footnote"><span>All names, activity and dollar amounts are fictional. No messages are sent.</span><span class="statusbar"><span class="mini"></span>USD · Sample snapshot 02 Oct 2026</span></footer>`;}
  function queue(){return heading('REOPEN THE CONVERSATION','A lead is more than a row.','See what happened, what is missing, and what to do next.',`<button class="button secondary" data-action="export">Export sample CSV ↓</button>`)+`<div class="filters"><input type="search" id="search" aria-label="Search sample leads" placeholder="Search name, source or owner…" value="${esc(search)}"><select id="filter" aria-label="Filter by status">${[['all','All sample leads'],...Object.entries(labels)].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></div><section class="panel"><div class="panelheader"><div><h2 id="queue-count"></h2><small>Opt-outs, active customers and active rep conversations remain excluded.</small></div></div><div id="queue-table"></div></section><p class="footnote">Age is from the fixed sample snapshot. Your demo actions persist in this browser.</p>`;}
  function updateQueue(){const rows=leads.filter(l=>(filter==='all'||l.status===filter)&&`${l.name} ${l.source} ${l.owner}`.toLowerCase().includes(search.toLowerCase()));document.getElementById('queue-count').textContent=rows.length+' sample '+(rows.length===1?'lead':'leads');document.getElementById('queue-table').innerHTML=table(rows);}
  function outcomes(){const s=M.stats(leads),rows=leads.filter(l=>l.payments.length);return heading('MEASURE WHAT MATTERS','From conversation to collection.','A payment trail you can trace back to the original lead.',`<button class="button secondary" data-action="export">Export sample CSV ↓</button>`)+`<div class="summarystrip">${stat('Sample gross collections',money(s.gross),'Settled sample payments')}${stat('Sample refunds',money(s.refunds),'Deducted from gross collections')}${stat('Sample net collections',money(s.net),'Before fees and delivery costs')}</div><div class="notice">These are attributed sample collections. A real pilot would compare a treatment group with a control group to measure additional revenue.</div><section class="panel"><div class="panelheader"><div><h2>Settlement ledger</h2><small>Open a lead to inspect the timeline or simulate a refund.</small></div><span class="pill">USD</span></div><div class="tablewrap"><table><thead><tr><th>Lead</th><th>Rep</th><th class="ledgernum">Settled</th><th class="ledgernum">Refunds</th><th class="ledgernum">Net</th></tr></thead><tbody>${rows.map(l=>`<tr><td>${person(l)}</td><td>${l.owner}</td><td class="ledgernum">${money(M.gross(l))}</td><td class="ledgernum">${money(M.refunds(l))}</td><td class="ledgernum"><strong>${money(M.net(l))}</strong></td></tr>`).join('')}</tbody></table></div></section><p class="footnote">No live payment processing. Financing fees, commissions and fulfilment costs are outside this demo.</p>`;}
  function playbook(){return heading('A SMALL, MEASURABLE PILOT','Prove the recovery. Then scale.','One cohort, one workflow, and a result that can be checked.')+`<div class="playbook"><section class="panel steps"><h2>The operating playbook</h2>${[['Start with the right cohort','Identify stale leads. Exclude opt-outs, current customers, and active rep conversations.'],['Keep a comparison group','Randomly split eligible leads between recovery outreach and the existing process.'],['Approve before outreach','Review messages, contact permission and lead ownership. Hand interested replies to a human.'],['Cancel stale reminders','On a cancellation or reschedule, replace pending reminders with the new appointment time.'],['Trace the actual outcome','Match payment IDs to leads. Deduplicate settlements and account for refunds and collection delays.'],['Decide using mature results','Measure bookings first, then net incremental collections after the sales and refund windows.']].map(([t,d],i)=>`<div class="step"><span class="stepnum">${i+1}</span><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</section><section class="panel calculator"><h2>What could one cohort unlock?</h2><p class="kicker">Illustrative scenario · not a prediction</p><div class="calcgrid">${[['cohort','Eligible leads',1000,0,100000,1],['booking','Additional booking rate (%)',4,0,100,.1],['show','Show rate (%)',60,0,100,1],['close','Close rate (%)',15,0,100,1],['cash','Cash collected per sale ($)',10000,0,1000000,100]].map(([id,label,value,min,max,step])=>`<label class="field" for="${id}">${label}<input type="number" id="${id}" value="${value}" min="${min}" max="${max}" step="${step}" data-calc></label>`).join('')}</div><div class="estimate" aria-live="polite"><small>Illustrative additional gross collections</small><strong id="estimate"></strong><small id="estimate-detail"></small></div><p class="helper">Eligible leads × additional booking rate × show rate × close rate × collected cash. Fractional sales represent an expected value. Excludes refunds, fees and costs.</p></section></div>`;}
  function calc(){const inputs=['cohort','booking','show','close','cash'].map(id=>document.getElementById(id));const valid=inputs.every(i=>i.value!==''&&i.checkValidity());document.getElementById('estimate').textContent=valid?money(M.forecast(...inputs.map(i=>Number(i.value)))):'Check your inputs';document.getElementById('estimate-detail').textContent=valid?'Scenario only. No guaranteed outcome.':'Use nonnegative values; percentages cannot exceed 100.';}
  function connections(){return heading('THE INTEGRATION BLUEPRINT','Fits around your sales stack.','Keep the CRM. Add the missing recovery workflow.')+`<div class="notice">Concept only. No accounts are connected, and no credentials are requested. Confirm native CRM features before building custom automation.</div><div class="cards">${[['C','Close CRM','Lead ownership, conversations and pipeline stages.','Sync lead IDs and rep assignments|Observe replies and stage changes|Review native workflows first'],['H','HighLevel','Calendar events and reminder coordination.','Read appointment changes|Cancel outdated reminders|Respect contact DND status'],['$','Payments','Settlement and refund attribution.','Match payment IDs to leads|Deduplicate event deliveries|Separate gross and net collections']].map(([icon,title,desc,items])=>`<section class="connectcard"><div class="connectorlogo" aria-hidden="true">${icon}</div><h3>${title}</h3><p>${desc}</p><ul>${items.split('|').map(t=>`<li>${t}</li>`).join('')}</ul><span class="pill">Planned · not connected</span></section>`).join('')}</div><section class="panel steps" style="margin-top:22px"><h2>Before the first real pilot</h2><div class="step"><span class="stepnum">01</span><div><strong>Confirm the actual workflow</strong><p>Current CRM, offer, lead stages, permissions, message channels and ownership rules.</p></div></div><div class="step"><span class="stepnum">02</span><div><strong>Build reliable event handling</strong><p>Authenticated events, retries, duplicate protection, an audit trail and cancellation-aware scheduling.</p></div></div><div class="step"><span class="stepnum">03</span><div><strong>Agree on attribution</strong><p>Cohort membership, control group, collection window, refunds, financing fees and the success metric.</p></div></div></section>`;}
  function render(){document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===route);if(b.closest('nav'))b.setAttribute('aria-current',b.dataset.route===route?'page':'false');});document.getElementById('breadcrumb').textContent=names[route];view.innerHTML=({overview,queue,outcomes,playbook,connections})[route]();if(route==='queue')updateQueue();if(route==='playbook')calc();}
  function openLead(id){selected=id;channel='SMS';drawLead();if(!dialog.open)dialog.showModal();}
  function drawLead(){const l=leads.find(l=>l.id===selected);if(!l)return;const action=l.status==='ready'?`<label class="field" for="channel">Channel<select id="channel"><option ${channel==='SMS'?'selected':''}>SMS</option><option ${channel==='Email'?'selected':''}>Email</option></select></label><label class="field" for="message">Follow-up draft<textarea id="message">${esc(l.draft||M.draft(l,channel))}</textarea></label><div class="actions"><button class="button" data-step="queue">Approve demo follow-up →</button></div><p class="helper">Editable template, not live AI generation. Approval updates this demo only.</p>`:l.status==='waiting'?`<div class="context">${l.draft?esc(l.draft).replace(/\n/g,'<br>'):'A sample follow-up is waiting for a reply.'}</div><button class="button" data-step="book">Simulate interested reply & booking →</button><p class="helper">An interested reply is handed to a rep. No calendar is connected.</p>`:l.status==='booked'?`<div class="context">Demo booked with ${l.owner}. In a real workflow, reminders would track the appointment time and be replaced when it changes.</div><button class="button" data-step="attend">Simulate demo attendance →</button><p class="helper">A booked call is not a collected sale.</p>`:l.status==='attended'?`<label class="field" for="amount">Sample settled amount (USD)<input id="amount" type="number" value="10000" min="0.01" max="1000000" step="0.01"></label><button class="button" data-step="collect">Simulate settled payment →</button><p class="helper">No money changes hands. Only the local sample ledger updates.</p>`:l.status==='collected'?`<div class="context">Settled ${money(M.gross(l))} · Refunded ${money(M.refunds(l))}<br><strong>Sample net collections: ${money(M.net(l))}</strong></div><label class="field" for="amount">Sample refund amount (USD)<input id="amount" type="number" value="${Math.min(1000,M.net(l))}" min="0.01" max="${M.net(l)}" step="0.01"></label><button class="button secondary" data-step="refund" ${M.net(l)===0?'disabled':''}>Simulate refund</button><p class="helper">Refunds reduce the net ledger. No payment provider is connected.</p>`:`<div class="context"><strong>Outreach blocked</strong><br>${esc(l.reason)}.</div><p class="helper">This lead cannot enter the demo outreach workflow.</p>`;
    dialog.innerHTML=`<header class="dialoghead"><div><small>${l.id} · FICTIONAL LEAD</small><h2 id="lead-title">${l.name}</h2></div><button class="close" aria-label="Close lead details" data-action="close">×</button></header><div class="dialogbody">${badge(l)}<div class="detailgrid"><div><small>Source</small><strong>${l.source}</strong></div><div><small>Assigned rep</small><strong>${l.owner}</strong></div><div><small>Last touch at sample snapshot</small><strong>${l.idle} days ago</strong></div><div><small>Contact permission</small><strong>${l.consent?'Verified in sample':'Not eligible'}</strong></div></div><h3>Conversation context</h3><div class="context">${l.context}</div>${action}<p id="action-error" class="error" role="alert"></p><h3>The recovery trail</h3><ol class="timeline">${l.events.map(e=>`<li><strong>${esc(e.label)}</strong><small>${esc(e.detail)}</small><small>${e.at}</small></li>`).join('')}</ol></div>`;
  }
  function step(action){const l=leads.find(l=>l.id===selected);try{const amount=document.getElementById('amount'),message=document.getElementById('message');if(amount&&!amount.checkValidity())throw Error('Enter a valid positive amount within the available limit.');M.transition(l,action,{message:message?.value,amount:amount?.value});save();render();drawLead();dialog.querySelector('[data-step],.close')?.focus();notify(action==='collect'?'Sample collection recorded. Check the cash ledger.':action==='refund'?'Sample refund deducted from net collections.':'Demo updated. Nothing was sent.');}catch(e){document.getElementById('action-error').textContent=e.message;}}
  function exportCSV(){const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['DEMO DATA','Lead ID','Name','Source','Status','Owner','Gross USD','Refunds USD','Net USD','Exclusion reason'],...leads.map(l=>['FICTIONAL',l.id,l.name,l.source,labels[l.status],l.owner,M.gross(l),M.refunds(l),M.net(l),l.reason])];const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='relay-FICTIONAL-sample-ledger.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Fictional sample data exported.');}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){route=b.dataset.route;render();return;}if(b.dataset.lead){openLead(b.dataset.lead);return;}if(b.dataset.step){step(b.dataset.step);return;}if(b.dataset.action==='close'){dialog.close();return;}if(b.dataset.action==='export'){exportCSV();return;}if(b.dataset.action==='demo'){const l=leads.find(M.eligible);if(l)openLead(l.id);else{route='outcomes';render();notify('All eligible sample leads have been reviewed. Reset to replay.');}return;}if(b.dataset.action==='reset'){leads=M.seed();save();route='overview';search='';filter='ready';dialog.close();render();notify('Sample workspace restored.');}});
  document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;updateQueue();}if(e.target.matches('[data-calc]'))calc();});
  document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;updateQueue();}if(e.target.id==='channel'){channel=e.target.value;const l=leads.find(l=>l.id===selected);document.getElementById('message').value=M.draft(l,channel);}});
  document.getElementById('present').addEventListener('click',e=>{const on=document.body.classList.toggle('presentation');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Exit presentation':'Present';});
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
  render();
})();
</script></body></html>
